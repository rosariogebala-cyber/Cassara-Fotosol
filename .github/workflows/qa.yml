name: QA estático y accesibilidad
on:
  push:
    branches: [main, qa/auditoria-optimizacion]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Validaciones estáticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas estáticas de regresión
        run: node --test tests/static.test.mjs
      - name: Sintaxis de JavaScript
        run: |
          node --check js/main.js
          node --check js/analytics.js

  accessibility:
    name: Axe WCAG y responsive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar herramientas QA
        run: npm install --no-save --no-package-lock playwright @axe-core/playwright
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Ejecutar auditoría de navegador
        run: node --test tests/browser.test.mjs
      - name: Conservar capturas responsive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-responsive
          path: qa-screenshots/*.png
          if-no-files-found: warn

  lighthouse:
    name: Lighthouse Mobile y Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Lighthouse
        run: npm install --no-save --no-package-lock lighthouse
      - name: Servir landing local
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/fotosol-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
      - name: Lighthouse Mobile (3 mediciones independientes)
        run: |
          for i in 1 2 3; do
            npx lighthouse http://127.0.0.1:8765/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output=html --output-path="./lighthouse-mobile-run-$i" --quiet
          done
          node - <<'NODE'
          const fs = require('fs');
          const runs = [1, 2, 3].map(i => {
            const d = JSON.parse(fs.readFileSync(`lighthouse-mobile-run-${i}.report.json`, 'utf8'));
            return { run: i, score: Math.round(d.categories.performance.score * 100), lcp_ms: Math.round(d.audits['largest-contentful-paint'].numericValue), fcp_ms: Math.round(d.audits['first-contentful-paint'].numericValue), tbt_ms: Math.round(d.audits['total-blocking-time'].numericValue) };
          });
          const sorted = [...runs].sort((a, b) => a.lcp_ms - b.lcp_ms);
          const summary = { runs, medianLcpMs: sorted[1].lcp_ms, medianMobileScore: [...runs].sort((a,b)=>a.score-b.score)[1].score };
          fs.writeFileSync('lighthouse-mobile-summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - name: Lighthouse Desktop
        run: npx lighthouse http://127.0.0.1:8765/ --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output=html --output-path=./lighthouse-desktop --quiet
      - name: Publicar informes Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-desktop
          path: |
            lighthouse-*.json
            lighthouse-*.html
            lighthouse-mobile-summary.json
          if-no-files-found: warn
